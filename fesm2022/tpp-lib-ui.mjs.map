<div class="tpp-error-container">
  <div class="tpp-error-card">
    <div class="tpp-error-icon">
      <i class="ti ti-lock"></i>
    </div>
    <h1 class="tpp-error-code">401</h1>
    <h2 class="tpp-error-title">No autorizado</h2>
    <p class="tpp-error-message">No tiene permisos para acceder a esta página. Contacte al administrador o regrese al inicio.</p>
    @if (showButton()) {
      <button class="tpp-error-button" (click)="goHome()">
        {{ buttonText() }}
      </button>
    }
  </div>
</div>
