<div role="status" class="tpp-table-state">
  @if (isLoading()) {
    <tpp-loading-state size="md"/>
  } @else {
    <div class="tpp-table-state-icon">
      <i [class]="'ti ' + config().icon"></i>
    </div>
  }
  <p class="tpp-table-state-title">{{ displayedTitle() }}</p>
  <p class="tpp-table-state-description">{{ displayedDescription() }}</p>
  @if (showRetry()) {
    <button class="tpp-table-state-button" (click)="retry.emit()">
      <i class="ti ti-refresh"></i>
      Reintentar
    </button>
  }
</div>
