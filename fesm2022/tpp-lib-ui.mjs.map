<div
  class="buscador-backdrop lg:hidden"
  [class.visible]="buscadorVisible"
  (click)="alternarBusqueda()">
</div>
<div
  class="relative w-80 hidden lg:inline-block"
  [class.buscador-mobile]="buscadorVisible">
  <div class="max-lg:bg-white max-lg:p-4 rounded-xl">
    <p-iconfield iconPosition="left">
    <p-inputicon class="z-10">
      <i class="ti ti-search text-lg"></i>
    </p-inputicon>
    <p-autocomplete
      #autocompleteRef
      showClear="true"
      [placeholder]="placeholder"
      size="large"
      [inputStyle]="{ 'line-height' : '1.31' }"
      inputStyleClass="max-lg:shadow-none pl-10 pr-2"
      [(ngModel)]="value"
      fluid="true"
      raised="true"
      [suggestions]="items"
      (completeMethod)="buscar($event)" />
    </p-iconfield>
  </div>
</div>
<p-button
  (onClick)="alternarBusqueda()"
  class="inline-block lg:hidden"
  icon="ti ti-search text-2xl"
  [rounded]="true"
  [text]="true"
  severity="secondary" />
