<div role="status" class="tpp-table-state">
  @if (cargando()) {
    <tpp-loading size="md"/>
  } @else {
    <div class="tpp-table-state-icon">
      <i [class]="'ti ' + configuracion().icono"></i>
    </div>
  }
  <p class="tpp-table-state-titulo">{{ tituloMostrado() }}</p>
  <p class="tpp-table-state-descripcion">{{ descripcionMostrada() }}</p>
  @if (mostrarReintentar()) {
    <button class="tpp-table-state-button" (click)="reintentar.emit()">
      <i class="ti ti-refresh"></i>
      Reintentar
    </button>
  }
</div>
