<div class="tpp-error-container">
  <div class="tpp-error-card">
    <div class="tpp-error-icon">
      <i class="ti ti-server"></i>
    </div>
    <h1 class="tpp-error-code">500</h1>
    <h2 class="tpp-error-title">Error del servidor</h2>
    <p class="tpp-error-message">Ha ocurrido un error interno. Reintente más tarde o regrese al inicio.</p>
    @if (showButton()) {
      <button class="tpp-error-button" (click)="goHome()">
        {{ buttonText() }}
      </button>
    }
  </div>
</div>
