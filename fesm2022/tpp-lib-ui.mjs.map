<div class="tpp-error-container">
  <div class="tpp-error-card">
    <div class="tpp-error-icon">
      <i class="ti ti-search"></i>
    </div>
    <h1 class="tpp-error-code">404</h1>
    <h2 class="tpp-error-title">Página no encontrada</h2>
    <p class="tpp-error-message">La página que busca no existe o fue movida. Verifique la dirección o regrese al inicio.</p>
    @if (showButton()) {
      <button class="tpp-error-button" (click)="goHome()">
        {{ buttonText() }}
      </button>
    }
  </div>
</div>
