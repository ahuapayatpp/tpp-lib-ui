<p-dialog
  [(visible)]="visible"
  [header]="titulo()"
  [modal]="true"
  [dismissableMask]="false"
  [closeOnEscape]="!procesando()"
  draggable="false"
  [style]="{ width: '22rem' }">
  <div class="flex flex-col items-center w-full gap-4">
    <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto" [class]="configuracion().iconoBg">
      <span [class]="configuracion().icono + ' text-4xl ' + configuracion().iconoColor"></span>
    </div>
    <p class="text-gray-800 font-semibold text-center text-base mb-0">{{ mensaje() }}</p>
  </div>
  <ng-template #footer>
    <div class="flex gap-2 w-full">
      <p-button
        fluid="true"
        class="flex-1"
        [label]="labelCancelar()"
        variant="outlined"
        severity="secondary"
        [disabled]="procesando()"
        (click)="cancelar()"
        size="large" />
      <p-button
        fluid="true"
        class="flex-1"
        [label]="procesando() ? labelConfirmarCargando() : labelConfirmar()"
        [loading]="procesando()"
        severity="primary"
        (click)="confirmar()"
        size="large" />
    </div>
  </ng-template>
</p-dialog>
