<p-dialog
  [(visible)]="visible"
  header="Video tutorial"
  [modal]="true"
  [maximizable]="true"
  [dismissableMask]="false"
  draggable="false"
  contentStyleClass="p-0 overflow-hidden rounded-b-xl"
  [position]="'top'"
  [style]="{ width: '56rem', 'min-height': cargandoVideo() ? '28rem' : 'auto' }">
  @if (cargandoVideo()) {
    <div class="flex flex-col items-center justify-center py-16 gap-4 min-h-[28rem]">
      <tpp-loading-state size="md" />
      <p class="text-gray-400 text-sm">Cargando video tutorial...</p>
    </div>
  } @else {
    <div class="aspect-video">
      <video [src]="url()" controls class="w-full h-full bg-black object-contain"></video>
    </div>
  }
</p-dialog>
